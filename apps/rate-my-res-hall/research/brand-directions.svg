<text x="70" y="648" class="sans muted label">02 / BEFORE THE DECISION</text>
<use href="#pick" x="70" y="674" width="65" height="65"/><text x="153" y="721" class="serif navy" font-size="43">Before You Pick<tspan class="red">.</tspan></text>
<text x="72" y="771" class="sans muted" font-size="19">More of a student guide than a rating website.</text>
<text x="72" y="800" class="sans muted" font-size="19">The brackets frame the choice; the tick closes it.</text>
