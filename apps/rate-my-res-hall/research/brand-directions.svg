<use href="#room-list" x="84" y="379" width="43" height="43"/><text x="142" y="408" class="serif navy" font-size="26" font-weight="bold">The Room List<tspan class="red">.</tspan></text>
<text x="367" y="407" class="sans navy" font-size="14">Explore</text><text x="444" y="407" class="sans muted" font-size="14">Compare</text><text x="530" y="407" class="sans muted" font-size="14">Hall stats</text>
<text x="72" y="482" class="sans navy" font-size="19">Plainspoken. Practical. Built around your shortlist.</text>
<text x="72" y="514" class="sans muted small">Possible subline: Richmond housing, before your pick.</text>
