<text x="48" y="62" class="serif navy" font-size="38">Three ways to make this feel like its own thing.</text>
<text x="50" y="101" class="sans muted small">Name + vector mark + compact header + link preview. Concepts only. No name selected; domain availability unchecked.</text>
<!-- Direction one -->
<rect x="40" y="140" width="1480" height="430" rx="18" fill="#fff" stroke="#dce1eb"/>
<text x="70" y="178" class="sans muted label">01 / THE ROOM LIST</text>
<use href="#room-list" x="70" y="204" width="65" height="65"/><text x="153" y="251" class="serif navy" font-size="49" font-weight="bold">The Room List<tspan class="red">.</tspan></text>
<text x="72" y="301" class="sans muted" font-size="19">The list you make before housing selection.</text>
<text x="72" y="330" class="sans muted" font-size="19">The mark is a floor plan, not another house badge.</text>
